name: Build Keyfe Keder Radyo Android

on:
  push:
    branches: [ main ]
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - '**.pro'
      - '**.html'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

env:
  PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
  PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
  PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
  PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: keyfe-keder-radyo-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  build-play-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare upload keystore
        if: ${{ env.PLAY_KEYSTORE_BASE64 != '' }}
        run: echo "$PLAY_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
      - name: Build Play App Bundle
        env:
          KEYSTORE_FILE: ${{ env.PLAY_KEYSTORE_BASE64 != '' && 'upload-keystore.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ env.PLAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.PLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.PLAY_KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon
      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: keyfe-keder-radyo-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
      - name: Explain signing state
        run: |
          if [ -f upload-keystore.jks ]; then
            echo "AAB signed with the configured Play upload key."
          else
            echo "AAB built unsigned. Add the four PLAY_KEYSTORE_* / PLAY_KEY_ALIAS secrets for a Play-uploadable signed AAB."
          fi
